schema_version = 1
id = "ingress-secret-and-digest"
owner_phase = 2
arm = "feature"
expected_status = "red"
expected_reason_class = "leakage"
accept_any_reason = false

[profile]
name = "ctxeval-loopback"
provider = "openai"
model = "ctxeval-fixture"
context_limit_tokens = 20000
max_output_tokens = 2048

[stimulus]
prompt = "CTXEVAL-TASK-7 Ingest the leak-corpus fixture. Vault every secret marker, preserve the exact error span and the unknown-shaped identifier, and publish the ingress digest."

[wall]
tool_rounds = 8
tool_output_bytes = 131072
fixture = "leak-corpus.txt"

[assertions]
required_context_artifacts = ["context/sanitized", "context/vault"]
required_answer_tokens = ["CTXEVAL-FRAGMENT-8e2f5b71cc4a"]

[runtime]
name = "profile-limit"
context_limit = 20000

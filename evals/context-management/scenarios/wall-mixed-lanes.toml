[stimulus]
prompt = "CTXEVAL-TASK-3 Read the mixed-lanes fixture each round, then end with the exact final marker and the exact failing test identity."

[wall]
tool_rounds = 8
tool_output_bytes = 131072
fixture = "mixed-lanes.md"

[assertions]
required_final_marker = "CTXEVAL-FINAL-7f3a9c"
required_answer_tokens = ["CTXEVAL-CONSTRAINT-K1", "CTXEVAL-FAILING-TEST-T7"]

[runtime]
name = "profile-limit"
context_limit = 20000

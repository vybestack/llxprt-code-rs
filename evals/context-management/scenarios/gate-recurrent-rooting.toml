schema_version = 1
id = "gate-recurrent-rooting"
owner_phase = 6
arm = "feature"
expected_status = "red"
expected_reason_class = "missing-evidence"
accept_any_reason = true

[profile]
name = "ctxeval-loopback"
provider = "openai"
model = "ctxeval-fixture"
context_limit_tokens = 16000
max_output_tokens = 2048

[stimulus]
prompt = "CTXEVAL-TASK-10 Run five compaction generations over the fixture. Retain the supported claim, reject the unsupported claim with a typed provenance or precision failure."

[wall]
tool_rounds = 5
tool_output_bytes = 20480
fixture = "unsupported-claim.md"

[assertions]
required_context_artifacts = ["context/validation.json"]

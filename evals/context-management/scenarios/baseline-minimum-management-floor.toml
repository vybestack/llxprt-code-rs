schema_version = 1
id = "baseline-minimum-management-floor"
owner_phase = 4
arm = "minimum-floor"
expected_status = "red"
# Phase 0: the floor does not exist yet, so this arm walls exactly like the
# status-quo baseline. It may only turn green when Phase 4 supplies quotas, handle
# admission, the store, and deterministic read-back.
expected_reason_class = "context-limit"
accept_any_reason = false

[profile]
name = "ctxeval-loopback"
provider = "openai"
model = "ctxeval-fixture"
context_limit_tokens = 20000
max_output_tokens = 2048

[stimulus]
prompt = "CTXEVAL-BASELINE Minimum-management-floor arm: admit large outputs as handles, read back on demand, then end with the exact final marker."

[wall]
tool_rounds = 8
tool_output_bytes = 131072
fixture = "tool-output-block.txt"

[assertions]
required_final_marker = "CTXEVAL-FINAL-7f3a9c"
required_context_artifacts = ["context/rewrite-journal.log"]
required_outcomes = ["wrap_up"]

[runtime]
name = "minimum-floor-overrides"
context_limit = 4000

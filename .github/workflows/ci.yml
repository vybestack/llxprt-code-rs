name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }} (Rust ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_NET_OFFLINE: true
      HTTP_PROXY: http://127.0.0.1:9
      HTTPS_PROXY: http://127.0.0.1:9
      ALL_PROXY: http://127.0.0.1:9
    strategy:
      fail-fast: false
      matrix:
        rust: [1.88.0, stable]
        os: [ubuntu-latest, macos-latest]
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - name: Shell syntax check
        run: bash -n scripts/*.sh
      - name: Verify shipped dependency sources and empty Cargo home
        env:
          CARGO_HOME: ${{ runner.temp }}/test-cargo-home
          CARGO_TARGET_DIR: ${{ runner.temp }}/test-target
        run: |
          rm -rf "$CARGO_HOME" "$CARGO_TARGET_DIR"
          mkdir -p "$CARGO_HOME" "$CARGO_TARGET_DIR"
          python3 scripts/verify-registry-vendor.py
          cargo metadata --offline --locked --no-deps --format-version 1 >/dev/null
          test ! -e "$CARGO_HOME/registry"
      - name: Cargo fmt check
        env:
          CARGO_HOME: ${{ runner.temp }}/test-cargo-home
          CARGO_TARGET_DIR: ${{ runner.temp }}/test-target
        run: cargo fmt --all -- --check && cargo fmt --all --manifest-path xtask/Cargo.toml -- --check
      - name: xtask tests and production quality limits
        env:
          CARGO_HOME: ${{ runner.temp }}/test-cargo-home
          CARGO_TARGET_DIR: ${{ runner.temp }}/test-target
        run: |
          cargo test --offline --locked --manifest-path xtask/Cargo.toml
          cargo clippy --offline --locked --manifest-path xtask/Cargo.toml --all-targets --all-features -- -D warnings
          cargo xtask quality
      - name: Cargo clippy (-D warnings, offline locked workspace/all targets/features)
        env:
          CARGO_HOME: ${{ runner.temp }}/test-cargo-home
          CARGO_TARGET_DIR: ${{ runner.temp }}/test-target
        run: cargo clippy --offline --locked --workspace --all-targets --all-features -- -D warnings
      - name: Cargo test (offline locked workspace/all targets/features)
        env:
          CARGO_HOME: ${{ runner.temp }}/test-cargo-home
          CARGO_TARGET_DIR: ${{ runner.temp }}/test-target
        run: cargo test --offline --locked --workspace --all-targets --all-features
      - name: Direct offline vendored SerdesAI model and Responses clippy and tests
        env:
          CARGO_HOME: ${{ runner.temp }}/test-cargo-home
          CARGO_TARGET_DIR: ${{ runner.temp }}/serdes-ai-models-target
        run: |
          cargo clippy --offline --locked --manifest-path vendor/serdes-ai-models/Cargo.toml --features openai --all-targets -- -D warnings
          cargo test --offline --locked --manifest-path vendor/serdes-ai-models/Cargo.toml --features openai
          cargo clippy --offline --locked --manifest-path vendor/serdes-ai-responses/Cargo.toml --all-targets -- -D warnings
          cargo test --offline --locked --manifest-path vendor/serdes-ai-responses/Cargo.toml

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check release scripts
        run: bash -n scripts/*.sh && shellcheck -x scripts/*.sh

  release-build:
    needs: [test, shellcheck, doc, audit]
    # Resolve only from the shipped checksum-locked registry closure, then run the same strict
    # offline gates used by maintainers. The script builds and verifies the allow-listed bundle.
    name: release build + source bundle
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      # dtolnay/rust-toolchain@1.88.0
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Derive package release identity
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          args=(--github-output "$GITHUB_OUTPUT")
          if [[ "$REF_TYPE" == tag ]]; then
            args+=(--tag "$RELEASE_TAG")
            test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
            test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/release-version.py "${args[@]}"
      - name: Verify clean-cache offline dependency closure
        run: |
          python3 scripts/verify-registry-vendor.py
          empty_home="$(mktemp -d)"
          empty_target="$(mktemp -d)"
          trap 'rm -rf "$empty_home" "$empty_target"' EXIT
          CARGO_HOME="$empty_home" CARGO_TARGET_DIR="$empty_target" \
            CARGO_NET_OFFLINE=true HTTP_PROXY=http://127.0.0.1:9 \
            HTTPS_PROXY=http://127.0.0.1:9 ALL_PROXY=http://127.0.0.1:9 \
            cargo metadata --offline --locked --no-deps --format-version 1 >/dev/null
          test ! -e "$empty_home/registry/cache"
      - name: Source-bundle tooling present (python3 runs the robust archive validator)
        run: |
          python3 --version
          bash -n scripts/*.sh
      - name: Run strict release gates
        env:
          LLXPRT_SKIP_LOCAL_AUDIT: "1"
        run: bash scripts/release-gates.sh

      - name: Record source-bundle digest
        env:
          RELEASE_ARCHIVE: ${{ steps.release.outputs.archive }}
        run: |
          cd dist
          sha256sum "$RELEASE_ARCHIVE" > "$RELEASE_ARCHIVE.sha256"

      - name: Retain verified source bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: llxprt-code-rs-source-${{ github.sha }}
          path: |
            dist/${{ steps.release.outputs.archive }}
            dist/${{ steps.release.outputs.sidecar }}
          if-no-files-found: error
          retention-days: 90

  publish-release:
    name: publish immutable tagged source bundle
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: [release-build]
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      # dtolnay/rust-toolchain@1.88.0
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b
        with:
          toolchain: 1.88.0
      - name: Validate local tag and derive package release identity
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/release-version.py --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"
      - name: Download exact-commit source bundle
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: llxprt-code-rs-source-${{ github.sha }}
          path: dist
      - name: Verify remote annotated tag before attestation
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: bash scripts/publish-release.sh --verify-tag-only
      - name: Publish durable digest-addressed source objects
        id: source-oci
        env:
          GHCR_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EXPECTED_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_ARCHIVE: ${{ steps.release.outputs.archive }}
          RELEASE_SIDECAR: ${{ steps.release.outputs.sidecar }}
        run: |
          python3 scripts/verify-source-object-policy.py
          (cd dist && sha256sum --check "${{ steps.release.outputs.sidecar }}")
          python3 scripts/publish-source-oci.py
      - name: Attest exact source files
        # actions/attest-build-provenance@v4.2.2
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            dist/${{ steps.release.outputs.archive }}
            dist/${{ steps.release.outputs.sidecar }}
      - name: Attest published OCI manifest
        # actions/attest-build-provenance@v4.2.2
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ steps.source-oci.outputs.repository }}
          subject-digest: ${{ steps.source-oci.outputs.manifest-digest }}
          push-to-registry: true
      - name: Create atomic immutable release record
        env:
          # Administration-read is required to verify immutable-release policy. This fine-grained
          # token also needs contents-write to create the release record.
          GH_TOKEN: ${{ secrets.RELEASE_ADMIN_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_COMMIT: ${{ github.sha }}
          RELEASE_ARCHIVE: ${{ steps.release.outputs.archive }}
          RELEASE_SIDECAR: ${{ steps.release.outputs.sidecar }}
          SOURCE_OCI_MANIFEST_DIGEST: ${{ steps.source-oci.outputs.manifest-digest }}
          SOURCE_OCI_MANIFEST_URL: ${{ steps.source-oci.outputs.manifest-url }}
          SOURCE_OCI_ARCHIVE_URL: ${{ steps.source-oci.outputs.archive-url }}
          SOURCE_OCI_SIDECAR_URL: ${{ steps.source-oci.outputs.sidecar-url }}
        run: |
          (cd dist && sha256sum --check "$RELEASE_SIDECAR")
          bash scripts/publish-release.sh

  doc:
    name: rustdoc with denied warnings (MSRV)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # dtolnay/rust-toolchain@1.88.0
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b
        with:
          toolchain: 1.88.0
      - name: Verify shipped dependency sources for offline docs
        run: python3 scripts/verify-registry-vendor.py
      - name: crate and xtask docs from an empty Cargo home (warnings denied)
        run: |
          empty_home="$RUNNER_TEMP/doc-cargo-home"
          empty_target="$RUNNER_TEMP/doc-target"
          rm -rf "$empty_home" "$empty_target"
          mkdir -p "$empty_home" "$empty_target"
          export CARGO_HOME="$empty_home" CARGO_TARGET_DIR="$empty_target" CARGO_NET_OFFLINE=true
          export HTTP_PROXY=http://127.0.0.1:9 HTTPS_PROXY=http://127.0.0.1:9 ALL_PROXY=http://127.0.0.1:9
          RUSTDOCFLAGS="-D warnings" cargo doc --offline --locked --manifest-path xtask/Cargo.toml --all-features --no-deps
          RUSTDOCFLAGS="-D warnings" cargo doc --offline --locked --workspace --all-features --no-deps
          test ! -e "$empty_home/registry"

  audit:
    name: cargo audit (pinned, advisory fetch)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      # Reproducible audit: install a pinned cargo-audit with `--locked`, then run
      # `cargo audit` with a normal advisory fetch. `cargo audit` always fetches the
      # advisory database over the network; it is not an offline step. An offline
      # `cargo audit --no-fetch` against a local cache is a local-only gate.
      - name: install cargo-audit (pinned, --locked)
        # Run outside the checkout so this explicitly online tool does not inherit the project's
        # crates.io-to-registry-vendor replacement.
        run: (cd "$RUNNER_TEMP" && cargo install cargo-audit --version 0.21.2 --locked)
      - name: cargo audit (normal advisory fetch)
        run: |
          cargo audit --color always
          cargo audit --color always --file xtask/Cargo.lock
          for lockfile in vendor/*/Cargo.lock; do
            cargo audit --color always --file "$lockfile"
          done

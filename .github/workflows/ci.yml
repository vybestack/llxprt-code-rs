name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }} (Rust ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rust: [1.88.0, stable]
        os: [ubuntu-latest, macos-latest]
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - name: Shell syntax check
        run: bash -n scripts/*.sh
      - name: Fetch locked dependencies for offline gates
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path xtask/Cargo.toml
      - name: Cargo fmt check
        run: cargo fmt --all -- --check && cargo fmt --all --manifest-path xtask/Cargo.toml -- --check
      - name: xtask tests and production quality limits
        run: |
          cargo test --offline --locked --manifest-path xtask/Cargo.toml
          cargo clippy --offline --locked --manifest-path xtask/Cargo.toml --all-targets --all-features -- -D warnings
          cargo xtask quality
      - name: Cargo clippy (-D warnings, offline locked workspace/all targets/features)
        run: cargo clippy --offline --locked --workspace --all-targets --all-features -- -D warnings
      - name: Cargo test (offline locked workspace/all targets/features)
        run: cargo test --offline --locked --workspace --all-targets --all-features
      - name: Fetch vendored provider test dependencies
        run: cargo fetch --locked --manifest-path vendor/serdes-ai-models/Cargo.toml
      - name: Direct offline vendored SerdesAI OpenAI provider clippy and tests
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/serdes-ai-models-target
        run: |
          cargo clippy --offline --locked --manifest-path vendor/serdes-ai-models/Cargo.toml --features openai --all-targets -- -D warnings
          cargo test --offline --locked --manifest-path vendor/serdes-ai-models/Cargo.toml --features openai

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check release scripts
        run: bash -n scripts/*.sh && shellcheck -x scripts/*.sh

  release-build:
    needs: [test, shellcheck, doc, audit]
    # Fetch the locked registry graph once, then run the same strict offline gates used
    # by maintainers. The script builds and verifies the allow-listed source bundle.
    name: release build + source bundle
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Validate immutable tag identity
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$EXPECTED_COMMIT"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
      # dtolnay/rust-toolchain@1.88.0
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Fetch locked dependencies for offline gates
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path xtask/Cargo.toml
          cargo fetch --locked --manifest-path vendor/serdes-ai-models/Cargo.toml
      - name: Source-bundle tooling present (python3 runs the robust archive validator)
        run: |
          python3 --version
          bash -n scripts/*.sh
      - name: Run strict release gates
        env:
          LLXPRT_SKIP_LOCAL_AUDIT: "1"
        run: bash scripts/release-gates.sh

      - name: Record source-bundle digest
        run: |
          cd dist
          sha256sum llxprt-code-rs-0.1.0-source.tar.gz > llxprt-code-rs-0.1.0-source.tar.gz.sha256

      - name: Retain verified source bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: llxprt-code-rs-source-${{ github.sha }}
          path: |
            dist/llxprt-code-rs-0.1.0-source.tar.gz
            dist/llxprt-code-rs-0.1.0-source.tar.gz.sha256
          if-no-files-found: error
          retention-days: 90

  publish-release:
    name: publish immutable tagged source bundle
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: [release-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download exact-commit source bundle
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: llxprt-code-rs-source-${{ github.sha }}
          path: dist
      - name: Publish durable create-once release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG already exists; refusing to replace assets" >&2
            exit 1
          fi
          (cd dist && sha256sum --check llxprt-code-rs-0.1.0-source.tar.gz.sha256)
          gh release create "$RELEASE_TAG" \
            dist/llxprt-code-rs-0.1.0-source.tar.gz \
            dist/llxprt-code-rs-0.1.0-source.tar.gz.sha256 \
            --verify-tag --title "$RELEASE_TAG" --generate-notes

  doc:
    name: rustdoc with denied warnings (MSRV)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # dtolnay/rust-toolchain@1.88.0
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b
        with:
          toolchain: 1.88.0
      - name: Fetch locked dependencies for offline docs
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path xtask/Cargo.toml
      - name: crate and xtask docs (warnings denied)
        run: |
          RUSTDOCFLAGS="-D warnings" cargo doc --offline --locked --manifest-path xtask/Cargo.toml --all-features --no-deps
          RUSTDOCFLAGS="-D warnings" cargo doc --offline --locked --workspace --all-features --no-deps

  audit:
    name: cargo audit (pinned, advisory fetch)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      # Reproducible audit: install a pinned cargo-audit with `--locked`, then run
      # `cargo audit` with a normal advisory fetch. `cargo audit` always fetches the
      # advisory database over the network; it is not an offline step. An offline
      # `cargo audit --no-fetch` against a local cache is a local-only gate.
      - name: install cargo-audit (pinned, --locked)
        run: cargo install cargo-audit --version 0.21.2 --locked
      - name: cargo audit (normal advisory fetch)
        run: |
          cargo audit --color always
          cargo audit --color always --file xtask/Cargo.lock
          cargo audit --color always --file vendor/serdes-ai-models/Cargo.lock
